    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { HashRouter, Routes, Route, Link, NavLink, useLocation } = ReactRouterDOM;

        // ---------------------------------------------------------------
        // Hooks
        // ---------------------------------------------------------------

        // Sets document.title for the current route. Each page component calls
        // this once; the next page's call simply overwrites it on mount.
        function useTitle(title) {
            useEffect(() => {
                document.title = title;
            }, [title]);
        }

        // Filters the shared EVENTS array (events-data.js) down to whatever falls
        // in the next 31 days, computed fresh on mount — this is what powers the
        // "Next 31 Days" page. `now`/`upcoming` are memoized once per page load,
        // matching the previous vanilla-JS behavior (recompute happens because
        // this component remounts fresh each time you navigate to it).
        function useEvents() {
            return useMemo(() => {
                const now = new Date();
                const windowEnd = new Date(now.getTime() + 31 * 24 * 60 * 60 * 1000);
                const upcoming = EVENTS
                    .map(e => ({ ...e, parsed: new Date(e.date) }))
                    .filter(e => e.parsed >= now && e.parsed <= windowEnd)
                    .sort((a, b) => a.parsed - b.parsed);
                return { now, upcoming };
            }, []);

        // "Birth Sky" astronomy engine
        //
        // Plots the real arrangement of ~80 bright stars over Skellefteå at
        // 08:00 UTC (09:00 local — Sweden ran permanent CET with no DST until
        // 1980) on June 26, 1959: the morning Todd was born. Real math, not a
        // lookup table: Julian Date -> Greenwich Mean Sidereal Time -> Local
        // Sidereal Time -> per-star Hour Angle -> Altitude/Azimuth (standard
        // spherical astronomy) -> an equidistant-azimuthal ("planisphere")
        // projection onto a 0-100 viewBox circle, so the whole sky sphere
        // (zenith at center, nadir at the rim) maps onto one SVG without any
        // horizon clipping. Star RA/Dec are J2000 and NOT precession-corrected
        // back to 1959 — the drift over 41 years is a small fraction of a
        // degree, invisible at this stylized scale.
        //
        // Fun fact, not a bug: at 64.75°N in late June the sun doesn't

        // ---------------------------------------------------------------

        // [name, RA (decimal hours, J2000), Dec (decimal degrees, J2000), apparent magnitude]
        const BIRTH_SKY_STARS = [

            ['Mirach', 1.1622, 35.6206, 2.05], ['Rasalhague', 17.5822, 12.5601, 2.07],

            ['Sadr', 20.3705, 40.2567, 2.23], ['Schedar', 0.6751, 56.5373, 2.24],
            ['Eltanin', 17.9436, 51.4889, 2.24], ['Mintaka', 5.5334, -0.2991, 2.25],

            ['Alderamin', 21.3097, 62.5855, 2.45], ['Gienah', 12.2634, -17.5416, 2.59],
            ['Markab', 23.0794, 15.2053, 2.49], ['Enif', 21.7364, 9.8750, 2.40],
            ['Scheat', 23.0629, 28.0828, 2.42], ['Sabik', 17.1730, -15.7249, 2.43],
            ['Phecda', 11.8971, 53.6948, 2.44], ['Merak', 11.0307, 56.3824, 2.37],
            ['Alcyone', 3.7914, 24.1051, 2.87], ['Ruchbah', 1.4300, 60.2354, 2.68],
            ['Megrez', 12.2570, 57.0326, 3.31],
        ];

        const BIRTH_SKY_UTC = Date.UTC(1959, 5, 26, 8, 0, 0); // 1959-06-26 09:00 CET (UTC+1, no DST) = 08:00 UTC
        const BIRTH_SKY_LAT = 64.7507;  // Skellefteå, Sweden
        const BIRTH_SKY_LON = 20.9528;

        function julianDate(unixMs) {
            return unixMs / 86400000 + 2440587.5;
        }

        // Greenwich Mean Sidereal Time, in hours (Meeus, Astronomical Algorithms ch. 12)
        function gmstHours(jd) {
            const T = (jd - 2451545.0) / 36525;
            let g = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
                + 0.000387933 * T * T - (T * T * T) / 38710000;
            g = ((g % 360) + 360) % 360;
            return g / 15;
        }

        // Precesses a J2000.0 (RA hours, Dec degrees) coordinate to its position
        // at the target epoch `jd`, using the standard IAU 1976 precession angles
        // (Meeus, Astronomical Algorithms ch. 21 — the rigorous three-angle
        // rotation, not an approximation). Catalog RA/Dec drift slowly over time
        // as Earth's axis precesses; for a birth date 41 years before J2000 this
        // is worth ~0.1-1.3° per star if skipped — verified against astropy's
        // ICRS->AltAz transform (an independent, actively-maintained astronomy
        // library) during build 24, which confirmed applying this closes the gap
        // to ~0.01°, i.e. correctly accounts for essentially all of the drift.
        function precessFromJ2000(raHours, decDeg, jd) {
            const T = (jd - 2451545.0) / 36525; // centuries from J2000 to target epoch
            const asec = Math.PI / (180 * 3600);
            const zeta = (2306.2181 * T + 0.30188 * T * T + 0.017998 * T * T * T) * asec;
            const z = (2306.2181 * T + 1.09468 * T * T + 0.018203 * T * T * T) * asec;
            const theta = (2004.3109 * T - 0.42665 * T * T - 0.041833 * T * T * T) * asec;
            const ra0 = raHours * 15 * Math.PI / 180, dec0 = decDeg * Math.PI / 180;
            const A = Math.cos(dec0) * Math.sin(ra0 + zeta);
            const B = Math.cos(theta) * Math.cos(dec0) * Math.cos(ra0 + zeta) - Math.sin(theta) * Math.sin(dec0);
            const C = Math.sin(theta) * Math.cos(dec0) * Math.cos(ra0 + zeta) + Math.cos(theta) * Math.sin(dec0);
            let ra = Math.atan2(A, B) + z;
            const dec = Math.asin(Math.min(1, Math.max(-1, C)));
            ra = ((ra % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            return { raHours: ra * 180 / Math.PI / 15, decDeg: dec * 180 / Math.PI };
        }

        function starAltAz(raHours, decDeg, latDeg, lonDeg, jd) {
            const lst = (((gmstHours(jd) + lonDeg / 15) % 24) + 24) % 24;
            let haDeg = (lst - raHours) * 15;
            haDeg = ((haDeg + 540) % 360) - 180; // normalize to -180..180
            const ha = haDeg * Math.PI / 180, dec = decDeg * Math.PI / 180, lat = latDeg * Math.PI / 180;
            const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
            const alt = Math.asin(Math.min(1, Math.max(-1, sinAlt)));
            const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
            let az = Math.acos(Math.min(1, Math.max(-1, cosAz)));
            if (Math.sin(ha) > 0) az = 2 * Math.PI - az;
            return { altDeg: alt * 180 / Math.PI, azDeg: az * 180 / Math.PI };
        }

        // Computes {name, x, y, size, mag, altDeg, azDeg}[] (x/y as 0-100 viewBox
        // percentages) for every catalog star at the fixed birth moment/location,
        // precessed from J2000 to the target epoch first (see precessFromJ2000).
        // Pure function of constants above, so this only ever needs to run once.
        // Shared by the small background BirthSky component and the full-detail
        // BirthSkyFull page — altDeg/azDeg/mag are only consumed by the latter
        // (above/below-horizon styling, compass readout, star labels).
        function useBirthSky() {
            return useMemo(() => {
                const jd = julianDate(BIRTH_SKY_UTC);
                return BIRTH_SKY_STARS.map(([name, ra, dec, mag]) => {
                    const precessed = precessFromJ2000(ra, dec, jd);
                    const { altDeg, azDeg } = starAltAz(precessed.raHours, precessed.decDeg, BIRTH_SKY_LAT, BIRTH_SKY_LON, jd);
                    const r = (90 - altDeg) / 180; // 0 at zenith, 1 at nadir — always in [0,1]
                    const azRad = azDeg * Math.PI / 180;
                    const x = 50 + r * 50 * Math.sin(azRad);
                    const y = 50 - r * 50 * Math.cos(azRad);
                    const size = Math.max(0.6, 2.6 - mag * 0.45);
                    // Catalog spans mag -1.46 (Sirius) to 3.31 (Megrez) — normalize
                    // to a 0.15-1 brightness factor so faint stars render visibly
                    // dimmer than bright ones, not just smaller.
                    const brightness = Math.max(0.15, Math.min(1, (3.4 - mag) / 4.9));
                    return { name, x, y, size, mag, brightness, altDeg, azDeg };
                });
            }, []);
        }

        function BirthSkyFull() {
            useTitle('The Sky I Was Born Under | Todd Booth');
            const stars = useBirthSky();
            const labeled = [...stars].sort((a, b) => a.mag - b.mag).slice(0, 20);
            const labeledNames = new Set(labeled.map(s => s.name));

            return (
                <div className="page-content">
                    <Link to="/" className="back-link">← Back to Home</Link>
                    <h1>🌌 The Sky I Was Born Under</h1>
                    <p className="subtitle">
                        Skellefteå, Sweden — 09:00 local time, June 26, 19xx. The real
                        arrangement of the ~80 brightest stars, computed from first principles.
                    </p>

                    <div style={{ maxWidth: '560px', margin: '0 auto' }}>
                        <svg
                            viewBox="0 0 100 100"
                            style={{ width: '100%', height: 'auto', borderRadius: '50%', background: 'radial-gradient(circle, #0a1128 0%, #000000 100%)' }}
                        >
                            <circle cx="50" cy="50" r="25" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="0.3" strokeDasharray="1,1" />
                            <text x="50" y="4.5" textAnchor="middle" fontSize="4" fill="rgba(255,255,255,0.65)">N</text>
                            <text x="96.5" y="51.5" textAnchor="end" fontSize="4" fill="rgba(255,255,255,0.65)">E</text>
                            <text x="50" y="98.5" textAnchor="middle" fontSize="4" fill="rgba(255,255,255,0.65)">S</text>
                            <text x="3.5" y="51.5" textAnchor="start" fontSize="4" fill="rgba(255,255,255,0.65)">W</text>
                            {stars.map(s => (
                                <g key={s.name}>
                                    <circle
                                        cx={s.x}
                                        cy={s.y}
                                        r={s.size * 0.11}
                                        fill="#ffffff"
                                        opacity={Math.max(0.09, s.brightness * (s.altDeg >= 0 ? 1 : 0.34))}
                                    />
                                    {labeledNames.has(s.name) && (
                                        <text
                                            x={s.x + 1.6}
                                            y={s.y + 0.7}
                                            fontSize="2.1"
                                            fill={s.altDeg >= 0 ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)'}
                                        >
                                            {s.name}
                                        </text>
                                    )}
                                </g>
                            ))}
                        </svg>
                    </div>
                    <p style={{ textAlign: 'center', color: '#888', fontSize: '0.9rem', maxWidth: '560px', margin: '0.75rem auto 0' }}>
                        Brighter dots = brighter stars. The dashed ring marks the horizon —
                        stars inside it were above the horizon at that moment; stars outside
                        it were below it (dimmed here, on the far side of the sky).
                    </p>

                    <h2>How this is computed</h2>
                    <p>
                        Real astronomy, not a lookup table: each of the ~80 brightest stars'
                        catalog position (J2000.0 right ascension and declination) is first{' '}
                        <strong>precessed</strong> to June 26, 19xx — Earth's axis slowly wobbles
                        over centuries, so a star's exact position drifts a little over 41 years
                        — then converted through Julian Date → Greenwich Mean Sidereal Time →
                        Local Sidereal Time → Hour Angle → Altitude/Azimuth, using Skellefteå's
                        coordinates (64.75°N, 20.95°E) and the exact birth moment: 09:00 local
                        time, which was <strong>08:00 UTC</strong> — Sweden ran permanent CET
                        with no daylight saving time the date Todd was born (confirmed against
                        the historical timezone database — Sweden's only prior DST experiment
                        ended in 1916, and modern DST didn't start again until 1980).
                    </p>

                    <Callout>
                        <p>
                            <strong>Fun fact, not a bug:</strong> at 64.75°N in late June, the
                            sun barely sets — it was already broad daylight that morning, not a
                            starry night. None of this was actually visible to the naked eye.
                            The stars were still exactly where the math says; this plots where,
                            not what could be seen.
                        </p>
                    </Callout>

                    <p className="updated">
                        Computed live in your browser from real orbital mechanics, not a static
                        image or a lookup table.
                    </p>
                </div>
            );
        }

        function NotFound() {
            useTitle('Page Not Found | Todd Booth');
            return (
                <div className="page-content" style={{ textAlign: 'center' }}>
                    <h1>Page Not Found</h1>
                    <p style={{ margin: '1rem 0 2rem' }}>That page doesn't exist — maybe it moved.</p>
                    <Link to="/" className="download-vcard">← Back to Home</Link>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // App
        // ---------------------------------------------------------------

        function App() {
            return (
                <HashRouter>
                    <BirthSky />
                    <ScrollToTop />
                    <Header />
                    <div className="container">
                        <div className="content">
                            <Routes>
                                <Route path="/" element={<Home />} />
                                <Route path="/events" element={<Events />} />
                                <Route path="/next-31-days" element={<Next31Days />} />
                                <Route path="/world-cup" element={<WorldCup />} />
                                <Route path="/local-music" element={<LocalMusic />} />
                                <Route path="/troubadour-evenings" element={<TroubadourEvenings />} />
                                <Route path="/bbq-party" element={<BbqParty />} />
                                <Route path="/lion-bar" element={<LionBar />} />
                                <Route path="/sara-kulturhus" element={<SaraKulturhus />} />
                                <Route path="/about" element={<About />} />
                                <Route path="/background" element={<ProfessionalBackground />} />
                                <Route path="/contact" element={<Contact />} />
                                <Route path="/birth-sky" element={<BirthSkyFull />} />
                                <Route path="*" element={<NotFound />} />
                            </Routes>
                        </div>
                    </div>
                    <Footer />
                </HashRouter>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- PWA install support — plain script, not JSX, so it can run independently
         of the React app rendering successfully. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>

</html>
