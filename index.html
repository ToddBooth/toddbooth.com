</head>

                        return <HomeTab />;
                    case 'about':
                        return <AboutTab />;
                    case 'background':
                        return <ProfessionalBackgroundTab />;
                    case 'contact':
                        return <ContactTab />;
                    default:
                        return <HomeTab />;
                }
            };

            return (
                <>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} />
                    <div className="container">
                        <div className="content">
                            {renderTab()}
                        </div>
                    </div>
                    <Footer />
                </>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
