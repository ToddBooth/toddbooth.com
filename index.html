<body>
    <div id="root"></div>

    <script src="events-data.js?v=4"></script>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { HashRouter, Routes, Route, Link, NavLink, useLocation } = ReactRouterDOM;

        // ---------------------------------------------------------------
        // Hooks
        // ---------------------------------------------------------------

        // Sets document.title for the current route. Each page component calls
        // this once; the next page's call simply overwrites it on mount.
        function useTitle(title) {
            useEffect(() => {
                document.title = title;
            }, [title]);
        }

        // Filters the shared EVENTS array (events-data.js) down to whatever falls
        // in the next 7 days, computed fresh on mount — this is what powers the
        // "This Week" page. `now`/`upcoming` are memoized once per page load,
        // matching the previous vanilla-JS behavior (recompute happens because
        // this component remounts fresh each time you navigate to it).
        function useEvents() {
            return useMemo(() => {
                const now = new Date();
                const weekFromNow = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
                const upcoming = EVENTS
                    .map(e => ({ ...e, parsed: new Date(e.date) }))
                    .filter(e => e.parsed >= now && e.parsed <= weekFromNow)
                    .sort((a, b) => a.parsed - b.parsed);
                return { now, upcoming };
            }, []);
        }

        // ---------------------------------------------------------------
        // Shared components
        // ---------------------------------------------------------------

        // The glossy/puffy "Todd Booth" name badge (SVG + feSpecularLighting
        // bevel filter). One instance now, rendered by Header on every route —
        // previously this markup was hand-duplicated across 6 separate HTML files.
        function BubbleLogo() {
            return (
                <svg viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bubbleFill" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#ffd7e6" />
                            <stop offset="55%" stopColor="#ff6f9c" />
                            <stop offset="100%" stopColor="#ff2f6e" />
                        </linearGradient>
                        <filter id="glossyBevel" x="-30%" y="-60%" width="160%" height="240%" colorInterpolationFilters="sRGB">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
                            <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.9" specularExponent="20" lightingColor="#ffffff" result="specOut">
                                <fePointLight x="130" y="-40" z="150" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2" />
                            <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
                        </filter>
                    </defs>
                    <text x="50%" y="72%" textAnchor="middle" fontFamily="'Baloo 2', sans-serif" fontWeight="800" fontSize="70" fill="url(#bubbleFill)" stroke="#d42a68" strokeWidth="2.5" paintOrder="stroke fill" filter="url(#glossyBevel)">Todd Booth</text>
                </svg>
            );
        }

        // Scrolls to top on every route change — without this, navigating from a
        // long page (e.g. the World Cup schedule) to a short one leaves the
        // scroll position wherever it was, since this is now client-side routing
        // rather than a real page load.
        function ScrollToTop() {
            const location = useLocation();
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [location.pathname]);
            return null;
        }

        function Header() {
            const location = useLocation();
            const eventRoutes = ['/events', '/this-week', '/world-cup', '/local-music', '/troubadour-evenings'];
            const eventsActive = eventRoutes.includes(location.pathname);

            const tabs = [
                { to: '/', label: 'Home', end: true },
                { to: '/events', label: 'Events', forceActive: eventsActive },
                { to: '/about', label: 'About Me' },
                { to: '/background', label: 'Professional Background' },
                { to: '/contact', label: 'Contact' }
            ];

            return (
                <header>
                    <nav>
                        <div className="logo bubble-name" role="img" aria-label="Todd Booth">
                            <BubbleLogo />
                        </div>
                        <ul className="nav-tabs">
                            {tabs.map(tab => (
                                <li key={tab.to}>
                                    <NavLink
                                        to={tab.to}
                                        end={tab.end}
                                        className={({ isActive }) => (isActive || tab.forceActive) ? 'active' : ''}
                                    >
                                        {tab.label}
                                    </NavLink>
                                </li>
                            ))}
                        </ul>
